<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB Camera Switcher</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
    input[type="file"] {
      margin-bottom: 8px;
      display: block;
    }
    #mt-ui {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.78);
      border: 2px solid #555;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 13px;
      display: none;
      user-select: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }
    #mt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }
    #gear-box {
      width: 48px;
      height: 48px;
      border: 3px solid #888;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      background: #1a1a1a;
      color: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #gear-box.redline {
      border-color: #ff2222;
      box-shadow: 0 0 14px #ff2222, inset 0 0 8px rgba(255, 34, 34, 0.5);
      color: #ff6666;
    }
    #speed-info {
      text-align: right;
      line-height: 1.4;
    }
    #speed-val {
      font-size: 22px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }
    #rpm-bar-bg {
      width: 100%;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    #rpm-bar {
      width: 10%;
      height: 100%;
      background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c);
      transition: width 0.05s linear;
    }
    #h-gate {
      position: relative;
      width: 190px;
      height: 96px;
      background: #181818;
      border: 1px solid #444;
      border-radius: 6px;
      margin: 0 auto 8px auto;
    }
    .gate-slot {
      position: absolute;
      width: 24px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      color: #aaa;
      transform: translate(-50%, -50%);
    }
    .gate-slot.active-slot {
      color: #00ffcc;
      text-shadow: 0 0 6px #00ffcc;
    }
    .gate-line-h {
      position: absolute;
      top: 48px;
      left: 20px;
      width: 150px;
      height: 4px;
      background: #444;
      transform: translateY(-50%);
    }
    .gate-line-v {
      position: absolute;
      top: 18px;
      width: 4px;
      height: 60px;
      background: #444;
      transform: translateX(-50%);
    }
    #shift-knob {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff5555, #aa0000);
      border: 2px solid #fff;
      transform: translate(-50%, -50%);
      transition: left 0.1s ease-out, top 0.1s ease-out;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
      z-index: 2;
    }
    #mt-help {
      font-size: 11px;
      color: #bbb;
      text-align: center;
      line-height: 1.4;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <input type="file" id="fileInput" accept=".glb" />
    <div>現在のカメラ: <strong id="camName">なし</strong></div>
    <div>[1] 射手 ⇄ 車長</div>
    <div>[2] ガンナー ⇄ 運転席 ⇄ 助手席</div>
    <div>[￥] フリカメ（WASD歩行・Spaceジャンプ・マウス操作）</div>
    <div>[Q/E] 銃座旋回（慣性付き）</div>
    <div>[WASD] 車軸回転・操舵（射手・車長カメラ時）</div>
  </div>

  <div id="mt-ui">
    <div id="mt-header">
      <div id="gear-box">N</div>
      <div id="speed-info">
        <div><span id="speed-val">0</span> km/h</div>
        <div style="font-size: 11px; color: #aaa;" id="engine-state">IDLING</div>
      </div>
    </div>
    <div id="rpm-bar-bg"><div id="rpm-bar"></div></div>
    <div id="h-gate">
      <div class="gate-line-h"></div>
      <div class="gate-line-v" style="left: 20px;"></div>
      <div class="gate-line-v" style="left: 57.5px;"></div>
      <div class="gate-line-v" style="left: 95px;"></div>
      <div class="gate-line-v" style="left: 132.5px;"></div>
      <div class="gate-line-v" style="left: 170px;"></div>

      <div class="gate-slot" data-gear="1" style="left: 20px; top: 14px;">1</div>
      <div class="gate-slot" data-gear="2" style="left: 20px; top: 82px;">2</div>
      <div class="gate-slot" data-gear="3" style="left: 57.5px; top: 14px;">3</div>
      <div class="gate-slot" data-gear="4" style="left: 57.5px; top: 82px;">4</div>
      <div class="gate-slot" data-gear="5" style="left: 95px; top: 14px;">5</div>
      <div class="gate-slot" data-gear="6" style="left: 95px; top: 82px;">6</div>
      <div class="gate-slot" data-gear="7" style="left: 132.5px; top: 14px;">7</div>
      <div class="gate-slot" data-gear="8" style="left: 132.5px; top: 82px;">8</div>
      <div class="gate-slot" data-gear="R" style="left: 170px; top: 82px;">R</div>

      <div id="shift-knob" style="left: 57.5px; top: 48px;"></div>
    </div>
    <div id="mt-help">シフト操作: [U]上 [J]下 [H]左 [K]右<br>[W]アクセル [S]ブレーキ</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Sky } from 'three/addons/objects/Sky.js';

    const scene = new THREE.Scene();

    const sky = new Sky();
    sky.scale.setScalar(450000);
    scene.add(sky);

    const sun = new THREE.Vector3();
    const phi = THREE.MathUtils.degToRad(88);
    const theta = THREE.MathUtils.degToRad(180);
    sun.setFromSphericalCoords(1, phi, theta);
    sky.material.uniforms['sunPosition'].value.copy(sun);

    const defaultCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    defaultCamera.position.set(0, 2, 5);
    let activeCamera = defaultCamera;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.shadowMap.autoUpdate = false;
    document.body.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const skyEnvScene = new THREE.Scene();
    const envSky = new Sky();
    envSky.scale.setScalar(10000);
    envSky.material.uniforms['turbidity'].value = 4;
    envSky.material.uniforms['rayleigh'].value = 2;
    envSky.material.uniforms['mieCoefficient'].value = 0.005;
    envSky.material.uniforms['mieDirectionalG'].value = 0.8;
    envSky.material.uniforms['sunPosition'].value.copy(sun);
    skyEnvScene.add(envSky);
    const envRT = pmremGenerator.fromScene(skyEnvScene, 0.04);
    scene.environment = envRT.texture;
    scene.environmentIntensity = 1.0;
    pmremGenerator.dispose();

    sky.material.uniforms['turbidity'].value = 4;
    sky.material.uniforms['rayleigh'].value = 2;
    sky.material.uniforms['mieCoefficient'].value = 0.005;
    sky.material.uniforms['mieDirectionalG'].value = 0.8;

    const controls = new OrbitControls(defaultCamera, renderer.domElement);
    controls.enableDamping = true;

    const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x3b352e, 0.65);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff1dc, 2.2);
    dirLight.position.copy(sun).multiplyScalar(100);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 300;
    dirLight.shadow.camera.left = -30;
    dirLight.shadow.camera.right = 30;
    dirLight.shadow.camera.top = 30;
    dirLight.shadow.camera.bottom = -30;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const loader = new GLTFLoader();
    let loadedModel = null;
    const cameras = {};
    let seatIndex = 0;
    const seatNames = ['射手', '車長'];

    let group2Index = 0;
    const group2Names = ['ガンナー', '運転席', '助手席'];

    let isFreeLook = false;
    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;
    const freeLookEuler = new THREE.Euler(0, 0, 0, 'YXZ');

    const camNameEl = document.getElementById('camName');
    const mtUiEl = document.getElementById('mt-ui');
    const gearBoxEl = document.getElementById('gear-box');
    const speedValEl = document.getElementById('speed-val');
    const engineStateEl = document.getElementById('engine-state');
    const rpmBarEl = document.getElementById('rpm-bar');
    const shiftKnobEl = document.getElementById('shift-knob');
    const gateSlots = document.querySelectorAll('.gate-slot');

    const nodes = {};
    const initialRotations = {};
    const pressedKeys = new Set();
    let turretVelocity = 0;
    let steerAngle = 0;
    let vehicleHeading = 0;

    // マニュアルトランスミッション状態
    let leverCol = 1;
    let leverRow = 0;
    let currentGear = 'N';
    let vehicleSpeedKmh = 0;

    const gearSpecs = {
      '1': { minSpeed: 0,   maxSpeed: 75,  optimalMin: 0,  optimalMax: 65,  baseAccel: 70.0 },
      '2': { minSpeed: 40,  maxSpeed: 140, optimalMin: 50, optimalMax: 125, baseAccel: 57.5 },
      '3': { minSpeed: 90,  maxSpeed: 210, optimalMin: 110, optimalMax: 190, baseAccel: 47.5 },
      '4': { minSpeed: 150, maxSpeed: 290, optimalMin: 175, optimalMax: 265, baseAccel: 40.0 },
      '5': { minSpeed: 220, maxSpeed: 370, optimalMin: 250, optimalMax: 340, baseAccel: 34.0 },
      '6': { minSpeed: 290, maxSpeed: 450, optimalMin: 320, optimalMax: 420, baseAccel: 29.0 },
      '7': { minSpeed: 360, maxSpeed: 530, optimalMin: 400, optimalMax: 500, baseAccel: 25.0 },
      '8': { minSpeed: 440, maxSpeed: 625, optimalMin: 475, optimalMax: 590, baseAccel: 21.0 },
      'R': { minSpeed: 0,   maxSpeed: 100, optimalMin: 0,  optimalMax: 90,  baseAccel: 50.0 }
    };

    function resolveGearFromLever() {
      if (leverRow === 0) return 'N';
      if (leverCol === 0) return leverRow === -1 ? '1' : '2';
      if (leverCol === 1) return leverRow === -1 ? '3' : '4';
      if (leverCol === 2) return leverRow === -1 ? '5' : '6';
      if (leverCol === 3) return leverRow === -1 ? '7' : '8';
      if (leverCol === 4) return leverRow === 1 ? 'R' : 'N';
      return 'N';
    }

    function updateShiftUI() {
      const colX = [20, 57.5, 95, 132.5, 170];
      const rowY = { '-1': 14, '0': 48, '1': 82 };
      shiftKnobEl.style.left = colX[leverCol] + 'px';
      shiftKnobEl.style.top = rowY[String(leverRow)] + 'px';

      currentGear = resolveGearFromLever();
      gearBoxEl.textContent = currentGear;

      gateSlots.forEach((slot) => {
        if (slot.dataset.gear === currentGear) {
          slot.classList.add('active-slot');
        } else {
          slot.classList.remove('active-slot');
        }
      });
    }

    function moveShiftLever(dir) {
      if (dir === 'U') {
        if (leverRow === 1) {
          leverRow = 0;
        } else if (leverRow === 0 && leverCol !== 4) {
          leverRow = -1;
        }
      } else if (dir === 'J') {
        if (leverRow === -1) {
          leverRow = 0;
        } else if (leverRow === 0) {
          leverRow = 1;
        }
      } else if (dir === 'H') {
        if (leverRow === 0 && leverCol > 0) {
          leverCol--;
        }
      } else if (dir === 'K') {
        if (leverRow === 0 && leverCol < 4) {
          leverCol++;
        }
      }
      updateShiftUI();
    }

    const raycaster = new THREE.Raycaster();
    raycaster.firstHitOnly = true;
    const downDir = new THREE.Vector3(0, -1, 0);
    let allSceneMeshes = [];
    const physicsEntities = [];

    const _worldPos = new THREE.Vector3();
    const _rayOrigin = new THREE.Vector3();
    const _forward = new THREE.Vector3();
    const _right = new THREE.Vector3();
    const _moveDir = new THREE.Vector3();
    const _moveStepWorld = new THREE.Vector3();
    const _horizDir = new THREE.Vector3();
    const _finalMoveWorld = new THREE.Vector3();
    const _parentScale = new THREE.Vector3();
    const _parentQuat = new THREE.Quaternion();
    const _meshBox = new THREE.Box3();
    const _rayBox = new THREE.Box3();

    function getNode(name) {
      return nodes[name] || null;
    }

    function setupPhysics() {
      allSceneMeshes = [];
      physicsEntities.length = 0;
      if (!loadedModel) return;

      loadedModel.updateMatrixWorld(true);

      loadedModel.traverse((child) => {
        if (child.isMesh) {
          if (!child.geometry.boundingBox) {
            child.geometry.computeBoundingBox();
          }
          if (!child.geometry.boundingSphere) {
            child.geometry.computeBoundingSphere();
          }
          const worldBox = child.geometry.boundingBox.clone().applyMatrix4(child.matrixWorld);
          child.userData.worldBox = worldBox;
          allSceneMeshes.push(child);
        }
      });

      const targets = [
        { obj: cameras['フリカメ'], laserLength: 16.2, isFrikame: true },
        { obj: getNode('8輪装輪装甲車'), laserLength: 0, isFrikame: false },
        { obj: getNode('HMMWV'), laserLength: 0, isFrikame: false }
      ];

      loadedModel.children.forEach((child) => {
        if (child.name === '基地') return;
        if (child === cameras['フリカメ'] || child === getNode('8輪装輪装甲車') || child === getNode('HMMWV')) return;
        if (child.isCamera && child.name !== 'フリカメ') return;
        let containsSeatCamera = false;
        child.traverse((sub) => {
          if (sub.isCamera && sub.name !== 'フリカメ') {
            containsSeatCamera = true;
          }
        });
        if (!containsSeatCamera) {
          targets.push({ obj: child, laserLength: 0, isFrikame: false });
        }
      });

      targets.forEach((t) => {
        if (!t.obj) return;
        const ownMeshes = new Set();
        t.obj.traverse((sub) => {
          if (sub.isMesh) {
            ownMeshes.add(sub);
          }
        });
        const collidableMeshes = allSceneMeshes.filter((m) => !ownMeshes.has(m));
        physicsEntities.push({
          obj: t.obj,
          laserLength: t.laserLength,
          isFrikame: t.isFrikame,
          collidableMeshes,
          vy: 0,
          onGround: false,
          settled: false,
          lastGroundY: null
        });
      });
    }

    function filterBroadphase(meshes, rayStart, rayEnd, padding) {
      _rayBox.makeEmpty();
      _rayBox.expandByPoint(rayStart);
      _rayBox.expandByPoint(rayEnd);
      _rayBox.expandByScalar(padding);

      const candidates = [];
      for (let i = 0; i < meshes.length; i++) {
        const m = meshes[i];
        const wb = m.userData.worldBox;
        if (!wb || wb.intersectsBox(_rayBox)) {
          candidates.push(m);
        }
      }
      return candidates;
    }

    function updatePhysics(dt) {
      if (physicsEntities.length === 0) return;

      const gravity = -9.8;
      const walkSpeed = 60.0;
      const jumpSpeed = 27.5;
      const _rayEnd = new THREE.Vector3();

      for (let idx = 0; idx < physicsEntities.length; idx++) {
        const entity = physicsEntities[idx];
        const obj = entity.obj;
        const isControlledFrikame = entity.isFrikame && activeCamera === obj;

        if (!isControlledFrikame && entity.settled && entity.onGround && entity.vy === 0) {
          continue;
        }

        if (isControlledFrikame) {
          _forward.set(0, 0, -1).applyQuaternion(obj.quaternion);
          _forward.y = 0;
          if (_forward.lengthSq() > 0) _forward.normalize();

          _right.set(1, 0, 0).applyQuaternion(obj.quaternion);
          _right.y = 0;
          if (_right.lengthSq() > 0) _right.normalize();

          _moveDir.set(0, 0, 0);
          if (pressedKeys.has('KeyW')) _moveDir.add(_forward);
          if (pressedKeys.has('KeyS')) _moveDir.sub(_forward);
          if (pressedKeys.has('KeyD')) _moveDir.add(_right);
          if (pressedKeys.has('KeyA')) _moveDir.sub(_right);

          if (_moveDir.lengthSq() > 0) {
            _moveDir.normalize();
            _moveStepWorld.copy(_moveDir).multiplyScalar(walkSpeed * dt);
            const stepLen = _moveStepWorld.length();

            obj.updateMatrixWorld(true);
            obj.getWorldPosition(_worldPos);

            let allowedStep = stepLen;
            if (entity.collidableMeshes.length > 0 && stepLen > 0) {
              _horizDir.copy(_moveStepWorld).normalize();
              const bodyRadius = 0.6;
              const checkHeights = [0.5 - entity.laserLength + 0.5, -entity.laserLength * 0.5, 0];
              for (let h = 0; h < checkHeights.length; h++) {
                _rayOrigin.copy(_worldPos);
                _rayOrigin.y += checkHeights[h];
                _rayEnd.copy(_rayOrigin).addScaledVector(_horizDir, stepLen + bodyRadius);
                const candidates = filterBroadphase(entity.collidableMeshes, _rayOrigin, _rayEnd, 1.0);
                if (candidates.length > 0) {
                  raycaster.set(_rayOrigin, _horizDir);
                  raycaster.near = 0;
                  raycaster.far = stepLen + bodyRadius;
                  const hits = raycaster.intersectObjects(candidates, false);
                  if (hits.length > 0) {
                    const safeDist = Math.max(0, hits[0].distance - bodyRadius);
                    if (safeDist < allowedStep) {
                      allowedStep = safeDist;
                    }
                  }
                }
              }
            }

            if (allowedStep > 0) {
              _finalMoveWorld.copy(_moveDir).multiplyScalar(allowedStep);
              if (obj.parent) {
                obj.parent.getWorldScale(_parentScale);
                obj.parent.getWorldQuaternion(_parentQuat).invert();
                _finalMoveWorld.applyQuaternion(_parentQuat);
                obj.position.x += _finalMoveWorld.x / (_parentScale.x || 1);
                obj.position.z += _finalMoveWorld.z / (_parentScale.z || 1);
              } else {
                obj.position.add(_finalMoveWorld);
              }
              entity.settled = false;
            }
          }

          if (pressedKeys.has('Space') && entity.onGround) {
            entity.vy = jumpSpeed;
            entity.onGround = false;
            entity.settled = false;
          }
        }

        if (entity.onGround && entity.vy === 0 && !isControlledFrikame) {
          entity.settled = true;
          continue;
        }

        entity.vy += gravity * dt;
        const dyWorld = entity.vy * dt;

        obj.updateMatrixWorld(true);
        obj.getWorldPosition(_worldPos);

        const rayOffsetUp = 0.5;
        _rayOrigin.copy(_worldPos);
        _rayOrigin.y += rayOffsetUp;

        const maxDist = rayOffsetUp + entity.laserLength + Math.max(0, -dyWorld) + 0.05;
        _rayEnd.copy(_rayOrigin);
        _rayEnd.y -= maxDist;

        let hitY = null;
        if (entity.collidableMeshes.length > 0) {
          const candidates = filterBroadphase(entity.collidableMeshes, _rayOrigin, _rayEnd, 0.5);
          if (candidates.length > 0) {
            raycaster.set(_rayOrigin, downDir);
            raycaster.near = 0;
            raycaster.far = maxDist;
            const intersects = raycaster.intersectObjects(candidates, false);
            if (intersects.length > 0) {
              hitY = intersects[0].point.y;
            }
          }
        }

        const nextWorldY = _worldPos.y + dyWorld;
        const targetFloorWorldY = hitY !== null ? hitY + entity.laserLength : null;

        if (targetFloorWorldY !== null && nextWorldY <= targetFloorWorldY && entity.vy <= 0) {
          const correctionWorldY = targetFloorWorldY - _worldPos.y;
          if (Math.abs(correctionWorldY) > 1e-5) {
            if (obj.parent) {
              obj.parent.getWorldScale(_parentScale);
              obj.position.y += correctionWorldY / (_parentScale.y || 1);
            } else {
              obj.position.y += correctionWorldY;
            }
            obj.updateMatrixWorld(true);
            obj.traverse((sub) => {
              if (sub.isMesh && sub.geometry.boundingBox) {
                sub.userData.worldBox = sub.geometry.boundingBox.clone().applyMatrix4(sub.matrixWorld);
              }
            });
          }
          entity.vy = 0;
          entity.onGround = true;
          if (!isControlledFrikame) {
            entity.settled = true;
          }
        } else {
          if (obj.parent) {
            obj.parent.getWorldScale(_parentScale);
            obj.position.y += dyWorld / (_parentScale.y || 1);
          } else {
            obj.position.y += dyWorld;
          }
          entity.onGround = false;
          entity.settled = false;
        }
      }
    }

    function updateAxleControls(dt) {
      const isControlCamera =
        activeCamera === cameras['射手'] ||
        activeCamera === cameras['車長'];

      mtUiEl.style.display = isControlCamera ? 'block' : 'none';

      if (!isControlCamera) return;

      const allAxles = ['右1軸', '右2軸', '右3軸', '右4軸', '左1軸', '左2軸', '左3軸', '左4軸', '左４軸'];
      const rightSteerAxles = ['右1軸', '右2軸'];
      const leftSteerAxles = ['左1軸', '左2軸'];

      const isThrottle = pressedKeys.has('KeyW');
      const isBrake = pressedKeys.has('KeyS');

      // ブレーキ: 5km/hずつ減速
      if (isBrake) {
        if (vehicleSpeedKmh > 0) {
          vehicleSpeedKmh = Math.max(0, vehicleSpeedKmh - 5.0);
        } else if (vehicleSpeedKmh < 0) {
          vehicleSpeedKmh = Math.min(0, vehicleSpeedKmh + 5.0);
        }
      }

      // アクセル＆ギア別加速ロジック
      let rpmRatio = 0.12;
      let isRedline = false;

      if (currentGear === 'N') {
        if (isThrottle) {
          rpmRatio = 0.85;
          engineStateEl.textContent = 'NEUTRAL REV';
        } else {
          rpmRatio = 0.12;
          engineStateEl.textContent = 'IDLING';
        }
        if (!isBrake) {
          const drag = 3.5 * dt;
          if (vehicleSpeedKmh > 0) vehicleSpeedKmh = Math.max(0, vehicleSpeedKmh - drag);
          else if (vehicleSpeedKmh < 0) vehicleSpeedKmh = Math.min(0, vehicleSpeedKmh + drag);
        }
      } else if (currentGear === 'R') {
        const spec = gearSpecs['R'];
        const absSpd = Math.abs(vehicleSpeedKmh);
        rpmRatio = Math.min(1.0, 0.15 + (absSpd / spec.maxSpeed) * 0.85);
        if (absSpd >= spec.optimalMax) {
          isRedline = true;
        }
        if (isThrottle && !isBrake) {
          if (vehicleSpeedKmh > 0) {
            vehicleSpeedKmh = Math.max(0, vehicleSpeedKmh - 15.0 * dt);
          } else if (absSpd < spec.maxSpeed) {
            const eff = absSpd >= spec.optimalMax ? 0.15 : 1.0;
            vehicleSpeedKmh = Math.max(-spec.maxSpeed, vehicleSpeedKmh - spec.baseAccel * 5.0 * eff * dt);
          }
          engineStateEl.textContent = 'REVERSE';
        } else if (!isBrake) {
          engineStateEl.textContent = absSpd > 0.1 ? 'COASTING' : 'IDLING';
          if (vehicleSpeedKmh < 0) vehicleSpeedKmh = Math.min(0, vehicleSpeedKmh + 3.0 * dt);
        } else {
          engineStateEl.textContent = 'BRAKING';
        }
      } else {
        const spec = gearSpecs[currentGear];
        const spd = Math.max(0, vehicleSpeedKmh);
        rpmRatio = Math.min(1.0, Math.max(0.12, (spd - spec.minSpeed * 0.5) / (spec.maxSpeed - spec.minSpeed * 0.5)));

        if (spd >= spec.optimalMax) {
          isRedline = true;
        }

        if (isThrottle && !isBrake) {
          if (vehicleSpeedKmh < 0) {
            vehicleSpeedKmh = Math.min(0, vehicleSpeedKmh + 15.0 * dt);
          } else if (spd < spec.maxSpeed) {
            let torqueEfficiency = 1.0;
            if (spd < spec.optimalMin) {
              const deficit = spec.optimalMin - spd;
              const gearNum = parseInt(currentGear, 10);
              torqueEfficiency = Math.max(0.04, Math.exp(-deficit * (0.045 + gearNum * 0.015)));
            } else if (spd >= spec.optimalMax) {
              torqueEfficiency = Math.max(0.02, 1.0 - (spd - spec.optimalMax) / (spec.maxSpeed - spec.optimalMax));
            }
            vehicleSpeedKmh = Math.min(spec.maxSpeed, vehicleSpeedKmh + spec.baseAccel * 5.0 * torqueEfficiency * dt);
          }
          engineStateEl.textContent = isRedline ? 'SHIFT UP!' : 'ACCELERATING';
        } else if (!isBrake) {
          engineStateEl.textContent = spd > 0.1 ? 'COASTING' : 'IDLING';
          if (vehicleSpeedKmh > 0) {
            vehicleSpeedKmh = Math.max(0, vehicleSpeedKmh - 2.5 * dt);
          }
        } else {
          engineStateEl.textContent = 'BRAKING';
        }
      }

      if (isRedline) {
        gearBoxEl.classList.add('redline');
      } else {
        gearBoxEl.classList.remove('redline');
      }

      speedValEl.textContent = Math.round(Math.abs(vehicleSpeedKmh));
      rpmBarEl.style.width = Math.round(rpmRatio * 100) + '%';

      if (Math.abs(vehicleSpeedKmh) > 0.01) {
        const signZ = (currentGear === 'R') ? 1.0 : -1.0;
        const angularVel = signZ * vehicleSpeedKmh * 0.25;
        for (let i = 0; i < allAxles.length; i++) {
          const bone = getNode(allAxles[i]);
          if (bone) {
            bone.rotation.z += angularVel * dt;
          }
        }
      }

      const maxSteerRad = THREE.MathUtils.degToRad(29);
      const steerSpeed = THREE.MathUtils.degToRad(60);
      let steerDir = 0;
      if (pressedKeys.has('KeyA')) steerDir -= 1;
      if (pressedKeys.has('KeyD')) steerDir += 1;

      if (steerDir !== 0) {
        steerAngle = THREE.MathUtils.clamp(steerAngle + steerDir * steerSpeed * dt, -maxSteerRad, maxSteerRad);
      } else {
        if (steerAngle > 0) {
          steerAngle = Math.max(0, steerAngle - steerSpeed * dt);
        } else if (steerAngle < 0) {
          steerAngle = Math.min(0, steerAngle + steerSpeed * dt);
        }
      }

      for (let i = 0; i < rightSteerAxles.length; i++) {
        const name = rightSteerAxles[i];
        const bone = getNode(name);
        if (bone) {
          const initY = initialRotations[name] ? initialRotations[name].y : 0;
          bone.rotation.y = initY + steerAngle;
        }
      }

      for (let i = 0; i < leftSteerAxles.length; i++) {
        const name = leftSteerAxles[i];
        const bone = getNode(name);
        if (bone) {
          const initY = initialRotations[name] ? initialRotations[name].y : 0;
          bone.rotation.y = initY + steerAngle;
        }
      }

      const apcGroup = getNode('8輪装輪装甲車');
      if (apcGroup && Math.abs(vehicleSpeedKmh) > 0.01) {
        const moveDist = (vehicleSpeedKmh / 3.6) * dt;
        const directionSign = (currentGear === 'R') ? 1.0 : -1.0;
        const effectiveDist = moveDist * directionSign;

        if (steerDir !== 0) {
          const turnRadius = 170.050;
          const angularSpeed = (Math.abs(vehicleSpeedKmh) / 3.6) / turnRadius;
          const turnSign = (steerDir > 0) ? 1.0 : -1.0;
          vehicleHeading += angularSpeed * dt * turnSign * directionSign;
          apcGroup.rotation.y = vehicleHeading;
        }

        const leftPivot = getNode('左折');
        const rightPivot = getNode('右折');

        if (steerDir < 0 && leftPivot) {
          apcGroup.position.sub(leftPivot.position);
          apcGroup.rotation.y = vehicleHeading;
          apcGroup.position.add(leftPivot.position);
          apcGroup.translateZ(effectiveDist);
        } else if (steerDir > 0 && rightPivot) {
          apcGroup.position.sub(rightPivot.position);
          apcGroup.rotation.y = vehicleHeading;
          apcGroup.position.add(rightPivot.position);
          apcGroup.translateZ(effectiveDist);
        } else {
          apcGroup.translateZ(effectiveDist);
        }
      }
    }

    function switchCamera(name) {
      const target = cameras[name];
      if (!target) return;

      target.near = 0.01;
      target.aspect = window.innerWidth / window.innerHeight;
      target.updateProjectionMatrix();
      activeCamera = target;
      camNameEl.textContent = name;

      controls.enabled = false;
      isFreeLook = true;
    }

    function loadGLB(file) {
      const url = URL.createObjectURL(file);
      loader.load(url, (gltf) => {
        if (loadedModel) {
          scene.remove(loadedModel);
        }
        for (const key in cameras) {
          delete cameras[key];
        }
        for (const key in nodes) {
          delete nodes[key];
        }
        for (const key in initialRotations) {
          delete initialRotations[key];
        }
        turretVelocity = 0;
        steerAngle = 0;
        vehicleHeading = 0;
        leverCol = 1;
        leverRow = 0;
        vehicleSpeedKmh = 0;
        updateShiftUI();

        loadedModel = gltf.scene;
        scene.add(loadedModel);

        loadedModel.traverse((obj) => {
          if (obj.isMesh) {
            obj.castShadow = true;
            obj.receiveShadow = true;
            obj.frustumCulled = true;
            if (obj.material) {
              obj.material.envMapIntensity = 1.0;
            }
          }
          if (obj.name) {
            nodes[obj.name] = obj;
            initialRotations[obj.name] = obj.rotation.clone();
          }
          if (obj.isCamera && obj.name) {
            obj.near = 0.01;
            obj.updateProjectionMatrix();
            cameras[obj.name] = obj;
          }
        });

        if (gltf.cameras) {
          gltf.cameras.forEach((cam) => {
            cam.near = 0.01;
            cam.updateProjectionMatrix();
            if (cam.name && !cameras[cam.name]) {
              cameras[cam.name] = cam;
            }
          });
        }

        setupPhysics();
        renderer.shadowMap.needsUpdate = true;

        seatIndex = 0;
        group2Index = 0;
        if (cameras['射手']) {
          switchCamera('射手');
        } else if (cameras['車長']) {
          switchCamera('車長');
        } else if (cameras['フリカメ']) {
          switchCamera('フリカメ');
        } else {
          activeCamera = defaultCamera;
          defaultCamera.near = 0.01;
          defaultCamera.updateProjectionMatrix();
          controls.object = defaultCamera;
          controls.enabled = true;
          isFreeLook = false;
          camNameEl.textContent = 'デフォルト';
        }

        URL.revokeObjectURL(url);
      });
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadGLB(file);
    });

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (!isFreeLook) return;
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isFreeLook || !isDragging) return;
      const dx = e.clientX - prevMouseX;
      const dy = e.clientY - prevMouseY;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;

      const sensitivity = 0.003 * 5;
      freeLookEuler.y -= dx * sensitivity;
      freeLookEuler.x -= dy * sensitivity;
      freeLookEuler.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, freeLookEuler.x));
      activeCamera.quaternion.setFromEuler(freeLookEuler);
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    window.addEventListener('keydown', (e) => {
      pressedKeys.add(e.code);
      if (e.repeat) return;

      const isControlCamera =
        activeCamera === cameras['射手'] ||
        activeCamera === cameras['車長'];

      if (isControlCamera) {
        if (e.code === 'KeyU') {
          moveShiftLever('U');
          return;
        } else if (e.code === 'KeyJ') {
          moveShiftLever('J');
          return;
        } else if (e.code === 'KeyH') {
          moveShiftLever('H');
          return;
        } else if (e.code === 'KeyK') {
          moveShiftLever('K');
          return;
        }
      }

      if (e.key === '1' || e.code === 'Digit1') {
        for (let i = 0; i < seatNames.length; i++) {
          const targetName = seatNames[seatIndex];
          seatIndex = (seatIndex + 1) % seatNames.length;
          if (cameras[targetName]) {
            switchCamera(targetName);
            break;
          }
        }
      } else if (e.key === '2' || e.code === 'Digit2') {
        for (let i = 0; i < group2Names.length; i++) {
          const targetName = group2Names[group2Index];
          group2Index = (group2Index + 1) % group2Names.length;
          if (cameras[targetName]) {
            switchCamera(targetName);
            break;
          }
        }
      } else if (e.key === '¥' || e.key === '\\' || e.code === 'IntlYen' || e.code === 'Backslash') {
        switchCamera('フリカメ');
      }
    });

    window.addEventListener('keyup', (e) => {
      pressedKeys.delete(e.code);
    });

    window.addEventListener('blur', () => {
      pressedKeys.clear();
    });

    window.addEventListener('resize', () => {
      activeCamera.aspect = window.innerWidth / window.innerHeight;
      activeCamera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    updateShiftUI();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      updatePhysics(dt);
      updateAxleControls(dt);

      const turret = getNode('銃座');
      if (turret) {
        let inputDir = 0;
        if (pressedKeys.has('KeyQ')) inputDir += 1;
        if (pressedKeys.has('KeyE')) inputDir -= 1;

        if (inputDir !== 0 || Math.abs(turretVelocity) > 1e-5) {
          const acceleration = 5.0;
          const damping = 3.0;

          turretVelocity += inputDir * acceleration * dt;
          turretVelocity -= turretVelocity * damping * dt;
          turret.rotation.y += turretVelocity * dt;
        } else {
          turretVelocity = 0;
        }
      }

      if (controls.enabled) {
        controls.update();
      }
      renderer.render(scene, activeCamera);
    }
    animate();
  </script>
</body>
</html>
